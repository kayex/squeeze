[package]
name = "cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Headless CLI for squeeze2."
build = "build.rs"

[build-dependencies]
# Embeds the .ico + VERSIONINFO into the PE. Only used on Windows targets.
winresource = "0.1"

# See the gui crate for why this block is required rather than optional.
[package.metadata.winresource]
ProductName = "squeeze"
FileDescription = "squeeze CLI — shrink ShadowPlay clips for Discord"
OriginalFilename = "squeeze-cli.exe"
InternalName = "squeeze-cli"
CompanyName = "Johan Vester"
LegalCopyright = "Copyright © 2026 Johan Vester. MIT licensed."
Comments = "https://github.com/kayex/squeeze2"

[[bin]]
name = "squeeze-cli"
path = "src/main.rs"

[dependencies]
engine = { path = "../engine" }
anyhow = "1"

[features]
default = []
# Forwards to engine/vcpkg. Build with: cargo build -p cli --features vcpkg
vcpkg = ["engine/vcpkg"]
# Forwards to engine/system (macOS/Linux dev via pkg-config).
system = ["engine/system"]
