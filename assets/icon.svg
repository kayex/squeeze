<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- squeeze: two chevrons converging on a video frame — reads as "compress".
       Deliberately bold and low-detail so it survives the 16px Explorer size. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5b6ee1"/>
      <stop offset="100%" stop-color="#3b45a8"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- upper chevron pointing down -->
  <path d="M64 74 L128 122 L192 74"
        fill="none" stroke="#ffffff" stroke-width="26"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- lower chevron pointing up -->
  <path d="M64 182 L128 134 L192 182"
        fill="none" stroke="#ffffff" stroke-width="26"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
