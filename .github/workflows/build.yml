name: build

# CI for main. Releases live in release.yml, kept separate so that this
# workflow's paths-ignore filter can never suppress a tagged release build.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

jobs:
  windows:
    uses: ./.github/workflows/windows-build.yml
