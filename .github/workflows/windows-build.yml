name: windows-build

# Reusable: builds the Windows binaries and uploads them as an artifact.
# Called by build.yml (CI on main) and release.yml (on a version tag), so the
# build recipe lives in exactly one place.
on:
  workflow_call:

jobs:
  windows:
    runs-on: windows-latest
    env:
      # static-md = FFmpeg + C deps linked static, MSVC CRT dynamic (matches
      # Rust's default /MD). Yields exes with no FFmpeg DLLs to ship.
      VCPKG_TRIPLET: x64-windows-static-md
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # Export the runner's vcpkg location into the env for later steps. NOTE:
      # ${{ env.VCPKG_INSTALLATION_ROOT }} does NOT work. The env context only
      # exposes workflow-defined vars, not runner-provided ones. Read it from the
      # actual process env ($env:...) and forward via $GITHUB_ENV instead.
      - name: Configure vcpkg env
        shell: pwsh
        run: |
          Add-Content $env:GITHUB_ENV "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT"
          Add-Content $env:GITHUB_ENV "VCPKGRS_TRIPLET=$env:VCPKG_TRIPLET"

      # Cache the built FFmpeg static libs/headers directly. We use explicit
      # restore + save (not actions/cache@v6) because that combined action only
      # saves on a *successful* job, and we want the 30-min FFmpeg build to
      # persist even when a later step (the link) fails. The save runs right
      # after install, before the build, so a failed build can't lose it.
      - name: Restore vcpkg installed tree
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: C:/vcpkg/installed
          key: vcpkg-installed-${{ env.VCPKG_TRIPLET }}-ffmpeg8-v4

      - name: Install FFmpeg (static, LGPL-only, NVENC + openh264 fallback) via vcpkg
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          & "C:\vcpkg\vcpkg.exe" install `
            "ffmpeg[avcodec,avformat,avfilter,swresample,swscale,nvcodec,openh264,zlib,dav1d]:$env:VCPKG_TRIPLET"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Save vcpkg installed tree
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: C:/vcpkg/installed
          key: vcpkg-installed-${{ env.VCPKG_TRIPLET }}-ffmpeg8-v4

      - name: Build squeeze.exe (gui) + squeeze-cli.exe (release, static FFmpeg)
        shell: pwsh
        run: cargo build --release -p cli -p gui --features cli/vcpkg,gui/vcpkg

      # CI compiled the binaries but never ran them, so a broken decode or a
      # missing software encoder would ship silently. The runner has no NVIDIA
      # GPU and the shipped FFmpeg has no libx264 (GPL), which makes this the
      # only place the openh264 fallback real users land on is ever exercised.
      # CI compiled the binaries but never ran them, so a broken decode or a
      # missing software encoder would ship silently. The runner has no NVIDIA
      # GPU and the shipped FFmpeg has no libx264 (GPL), which makes this the
      # only place the openh264 fallback real users land on is ever exercised.
      #
      # stderr goes to a file rather than through 2>&1: libav chatters there,
      # and folding it into the success stream can make PowerShell raise
      # NativeCommandError on output that is not an error at all.
      - name: Smoke test the built CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cli = 'target/release/squeeze-cli.exe'
          $out = $env:RUNNER_TEMP
          $src = 'tests/data/smoke.mp4'

          function Invoke-Cli($label, $cliArgs) {
            $errFile = Join-Path $out "$label.err"
            $stdout = & $cli @cliArgs 2> $errFile | Out-String
            $code = $LASTEXITCODE
            $stderr = if (Test-Path $errFile) { Get-Content $errFile -Raw } else { '' }
            Write-Host "--- $label (exit $code) ---"
            Write-Host $stdout
            if ($stderr) { Write-Host "stderr: $stderr" }
            return @{ Code = $code; Out = $stdout; Err = $stderr }
          }

          # A ceiling well under the source forces a real encode rather than
          # the copy path, and is tight enough to trip the frame-rate rule.
          $sw = Invoke-Cli 'openh264' @('--max-mb','0.15','--encoder','openh264','--suffix','_sw','-o',$out,$src)
          if ($sw.Code -ne 0) { throw "openh264 encode failed (exit $($sw.Code)): $($sw.Err)" }
          if ($sw.Out -notmatch 'libopenh264') { throw 'expected libopenh264 to be the encoder' }

          $file = Get-Item (Join-Path $out 'smoke_sw.mp4')
          if ($file.Length -gt 150000) { throw "over the 0.15 MB ceiling: $($file.Length) bytes" }
          if ($file.Length -lt 10000)  { throw "implausibly small: $($file.Length) bytes" }

          # Feeding the result back in proves it is readable H.264 without
          # needing ffprobe on the runner; a generous ceiling takes the copy path.
          $rt = Invoke-Cli 'readback' @('--max-mb','5','--suffix','_rt','-o',$out,(Join-Path $out 'smoke_sw.mp4'))
          if ($rt.Code -ne 0) { throw "could not read back the encoded output: $($rt.Err)" }
          if ($rt.Out -notmatch 'streams copied') { throw 'expected the copy path for a clip already under the limit' }

          # Auto has to resolve to something on a machine with no GPU: NVENC
          # cannot open, and this build carries no libx264.
          $auto = Invoke-Cli 'auto' @('--max-mb','0.15','--suffix','_auto','-o',$out,$src)
          if ($auto.Code -ne 0) { throw "auto encoder selection failed without a GPU (exit $($auto.Code)): $($auto.Err)" }
          if ($auto.Out -notmatch 'libopenh264') { throw 'auto should fall through to libopenh264 on a GPU-less machine' }

          Write-Host 'smoke test passed'

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/squeeze.exe dist/       # the app (gui crate)
          Copy-Item target/release/squeeze-cli.exe dist/   # headless CLI
          Copy-Item LICENSE dist/        # FFmpeg/LGPL notice rides along

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: squeeze-windows-x64
          path: dist/
          if-no-files-found: error
